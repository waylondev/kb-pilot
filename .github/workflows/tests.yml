name: tests

# The core path has no third-party dependencies by design (AGENTS.md: kb-ingest and
# kb-chat run on the standard library), and both test files are stdlib-only so they
# run anywhere. Nothing here installs packages, so a regression cannot hide behind
# a dependency-resolution failure.
#
# What is deliberately not covered here: per-format conversion quality. That needs
# firecrawl-anydoc / pymupdf / striprtf and a corpus of real documents; test_polish.py
# states that its runner belongs in tests/ too when that run happens.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: kb-ingest / kb-chat core path
        run: python tests/test_core.py

      - name: kb-polish stdlib-only scripts
        run: python tests/test_polish.py
